name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Create venv and install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev,docs]"
      - name: Test and lint
        run: |
          .venv/bin/pytest
          .venv/bin/ruff check satark tests
          .venv/bin/black --check satark tests examples --exclude examples/legacy
